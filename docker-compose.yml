services:
  shinouta-time:
    build: .
    ports:
      # 手元の PC からだけ開く(同じ LAN のほかの機器には見せない)
      - "127.0.0.1:8501:8501"
    volumes:
      - .:/app
    environment:
      - SHINOUTA_LOG_LEVEL=${SHINOUTA_LOG_LEVEL:-INFO}
      - SHINOUTA_ENABLE_FILE_LOGGING=${SHINOUTA_ENABLE_FILE_LOGGING:-false}
      - SHINOUTA_LOG_FILE=${SHINOUTA_LOG_FILE:-logs/shinouta.log}
      # 取り込み用(値はリポジトリに書かない。Git 管理外の .env に書く)
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - YOUTUBE_API_KEYS=${YOUTUBE_API_KEYS:-}
      - SHINOUTA_TRUSTED_COMMENTERS=${SHINOUTA_TRUSTED_COMMENTERS:-}
    command: streamlit run Home.py --server.address 0.0.0.0

  # ブラウザの確認(Playwright)。`docker compose up` では起動しない(profile)
  # 例: docker compose --profile browser run --rm browser pytest tests/browser --runbrowser
  # 手元のアプリは同じネットワークの http://shinouta-time:8501/ で開く(先に shinouta-time を起動しておく)
  browser:
    build:
      context: .
      dockerfile: Dockerfile.browser
    profiles: ["browser"]
    volumes:
      - .:/app
    working_dir: /app
